[project]
name = "nyay-api"
version = "0.1.0"
description = "Nyay.ai API: modular monolith (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "pgvector>=0.5.1",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pypdf>=6.20.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.1.4",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF", "N", "PT", "TID"]
# ASYNC109: provider interfaces take an explicit `timeout` that is passed to httpx.
# N818: domain names (InsufficientFunds, UnbalancedTransaction) read better without an Error suffix.
ignore = ["S101", "RUF001", "RUF002", "RUF003", "B008", "ASYNC109", "N818"]

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at 110; long string literals and comments may run to 130.
max-line-length = 130

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "PT012", "PT017", "PT018", "SIM105"]
"scripts/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
exclude = ["app/db/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["feedparser.*", "pgvector.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

# Every push and pull request: the same gates as `pnpm lint`, `pnpm test` and `pnpm e2e` on a developer machine.
# No provider keys are needed: with none set, OTP, payments, LLM and embeddings all run on their offline fakes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python scripts/check_secrets.py

  web:
    name: Web (lint, unit, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint:web
      - run: pnpm test:web
      - name: Install Playwright browser
        run: pnpm --filter @nyay/web exec playwright install --with-deps chromium
      - name: End-to-end (offline build, in-browser mocks)
        run: pnpm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  api:
    name: API (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nyay
          POSTGRES_PASSWORD: nyay
          POSTGRES_DB: nyay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nyay" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      ENV: test
      DATABASE_URL: postgresql://nyay:nyay@localhost:5432/nyay_test
      TEST_DATABASE_URL: postgresql://nyay:nyay@localhost:5432/nyay_test
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/1
      # Throwaway values for the test run only.
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      VISITOR_COOKIE_SECRET: ci-only-visitor-secret-not-used-anywhere-else
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app scripts
      - run: uv run pytest -q

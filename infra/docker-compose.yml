# OPTIONAL local stand-ins for the hosted services (Supabase Postgres, Upstash Redis).
# Nothing in the code depends on this file: the app only reads DATABASE_URL / REDIS_URL from .env.
# Use it on a machine without internet access or for the test suite:  docker compose -f infra/docker-compose.yml up -d
name: nyay

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${LOCAL_PG_USER:-nyay}
      POSTGRES_PASSWORD: ${LOCAL_PG_PASSWORD:-nyay}
      POSTGRES_DB: ${LOCAL_PG_DB:-nyay}
    ports:
      - "${LOCAL_PG_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_PG_USER:-nyay}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # AOF with fsync every second (brief §1.1). Upstash manages durability itself in production.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "${LOCAL_REDIS_PORT:-56379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ---- The app itself, opt-in:  docker compose -f infra/docker-compose.yml --profile app up --build
  # Reads the same repo-root .env; the URLs below point the containers at the stand-ins above instead.
  api:
    profiles: [app]
    build: ../services/api
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://${LOCAL_PG_USER:-nyay}:${LOCAL_PG_PASSWORD:-nyay}@postgres:5432/${LOCAL_PG_DB:-nyay}
      DATABASE_DIRECT_URL: ""
      REDIS_URL: redis://redis:6379/0
      # CORS: the browser calls the API from the containerised web app.
      WEB_ORIGIN: http://localhost:${LOCAL_WEB_PORT:-53000}
    ports:
      - "${LOCAL_API_PORT:-58100}:8100"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  migrate:
    profiles: [app]
    build: ../services/api
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://${LOCAL_PG_USER:-nyay}:${LOCAL_PG_PASSWORD:-nyay}@postgres:5432/${LOCAL_PG_DB:-nyay}
      DATABASE_DIRECT_URL: ""
      REDIS_URL: redis://redis:6379/0
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  web:
    profiles: [app]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${LOCAL_API_PORT:-58100}
        NEXT_PUBLIC_WS_URL: ws://localhost:${LOCAL_API_PORT:-58100}
        NEXT_PUBLIC_SITE_URL: http://localhost:${LOCAL_WEB_PORT:-53000}
    ports:
      - "${LOCAL_WEB_PORT:-53000}:3000"
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
